{{- /* chezmoi:modify-template */ -}}
{{- /*
  Grok writes ~/.grok/config.toml itself: the model picked in the TUI, /settings changes, marketplace
  and plugin state. So chezmoi does not own the file. It sets only the keys below, and only when one is
  missing or differs; otherwise the file passes through unchanged, byte for byte. The model is the user's.
  System-wide settings (the Xolotl model route, the plugin marketplace, the git-operator hook, the MCP
  servers) are in /etc/grok/managed_config.toml, rendered by workspace-ansible.
*/ -}}
{{- $want := list
  (list "cli" "installer" "internal")
  (list "cli" "auto_update" true)
  (list "marketplace" "default_skills_installs_purged" true)
  (list "marketplace" "official_marketplace_auto_installed" true)
  (list "ui" "max_thoughts_width" 120)
  (list "ui" "yolo" false)
  (list "ui" "compact_mode" false)
  (list "ui" "follow_up_behavior" "steer")
  (list "ui" "permission_mode" "always-approve")
  (list "ui" "default_selected_permission" "always_allow_all_sessions")
  (list "features" "subagent_model_inheritance" false)
-}}
{{- $config := dict -}}
{{- if trim .chezmoi.stdin -}}
{{-   $config = fromToml .chezmoi.stdin -}}
{{- end -}}
{{- $changed := false -}}
{{- range $want -}}
{{-   $section := index . 0 -}}
{{-   $key := index . 1 -}}
{{-   $value := index . 2 -}}
{{-   $current := dig $section $key "\x00unset" $config -}}
{{-   if ne (toJson $current) (toJson $value) -}}
{{-     $config = setValueAtPath (printf "%s.%s" $section $key) $value $config -}}
{{-     $changed = true -}}
{{-   end -}}
{{- end -}}
{{- if $changed -}}
{{    toToml $config }}
{{- else -}}
{{    .chezmoi.stdin }}
{{- end -}}
