# The models approved for agents, at each effort they are used at.
#
# Efforts: the band between a model's lowest and highest. Most models are not
# worth it at `low`, and do worse at `max` (or whatever their highest is).
#
# Each effort entry:
#   pareto:      true when no other entry here is both cheaper and smarter.
#   complexity:  the task complexities it executes.
#   risk:        the task risks it reviews.
#   usd-cost-per-task, intelligence-index, time-per-task-min: Artificial
#                Analysis Intelligence Index v5.0.1, from the effort's own model
#                page (artificialanalysis.ai/models/<model>-<effort>).
#
# Dispatch is a lookup, not a judgment: from the entries that list the task's
# `complexity` (or, for a review, its `risk`), take the cheapest. For a review,
# take the cheapest whose provider differs from the executor's, or the cheapest
# when none does. A task's `model` and `effort`, when set, override the lookup.
# Change the policy here, not on tasks.

- model: fable-5.2
  provider: claude
  description: |
    Use for only the most difficult design work, but hand off work quickly to other models as difficult decisions are made.
    Limited weekly usage.
  efforts:
    - effort: xhigh
      pareto: false
      usd-cost-per-task: 14.83
      intelligence-index: 62
      time-per-task-min: 27.5
    - effort: high
      pareto: true
      usd-cost-per-task: 9.08
      intelligence-index: 62
      time-per-task-min: 16.7
    - effort: medium
      pareto: true
      usd-cost-per-task: 3.80
      intelligence-index: 56
      time-per-task-min: 8.0
