# Shared skills: a real clone, not a mount, so changes are made on a branch and
# go up as PRs. Pi and Codex read ~/.agents/skills directly; Claude Code gets a
# symlink per skill. No refreshPeriod: chezmoi's own `git pull` would fight a PR
# branch checked out in the clone. run_after_update-skills.sh updates the clone
# on every apply when that is safe, then makes the links.
[".agents/skills"]
    type = "git-repo"
    url = "https://github.com/wyrd-company/skills.git"
    clone.args = ["--branch", "main"]
