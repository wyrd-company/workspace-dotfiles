- name: boat
  description: gives you sandboxes. A sandbox is a full Linux virtual machine with its own disk. You stop it to stop paying. You can resume it with the same disk for at least 14 days.
  install:
    url: https://boat.dev/install
    bin: ~/.ascii/bin/boat
    env:
      SHELL: /bin/sh
    sed:
      - 's|"\$INSTALL_DIR/\$MODE" onboard < /dev/tty|:|'
      - 's|"\$INSTALL_DIR/\$MODE" onboard|:|'
