# The Deck service the `deck` CLI talks to (dot_config/deck/config.yml.tmpl, docs/deck.md). Nothing here is secret.
# host_key is the public line `deck service host-key` (or the homelab's deck-bootstrap.fish) prints; while it is
# empty, chezmoi writes no Deck config.
deck:
  address: deck.internal:2222
  host_key: "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIA2AmpKfEvdXD1T9xwfACAFZ7CLlQZKHBZUtEb5Nl/us deck.internal"
  # Where `deck post` goes without a channel: [<bot>/]<channel id>, or empty for none.
  default_channel: ""
  # The workspace's options; its `workspace` names the Transit key, deck-<workspace>.
  workspace_config: /etc/workspace/config.yml
  # Names for `deck post|reply --mention NAME` and `--mention-role NAME`, mapped to Discord IDs (Developer Mode, then
  # Copy User ID or Copy Role ID). A user's name is their git operator handle. Names are case-sensitive and not all digits.
  aliases:
    users:
      boblangley: "120042068486651904"
      iradesa: "280148463789015040"
    roles:
      team: "1572717679809273906"
